name: Log Script Run

on:
  schedule:
    - cron: '* */12 * * *'
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Log run to file
        run: python3 tests/log_run.py

      - name: Commit and push log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add run_log.txt
          git commit -m "Log: $(date -u)" || echo "Nothing to commit"
          git push
